version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bloodbank_mysql
    restart: always
    environment:
      MYSQL_DATABASE: bloodbank_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: bloodbank_web
    restart: always
    command: /app/docker-entrypoint.sh
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-secret-key-change-in-prod
      - ALLOWED_HOSTS=*
      - DB_NAME=bloodbank_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  mysql_data:
